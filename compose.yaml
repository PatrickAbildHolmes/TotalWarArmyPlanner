name: TotalWarArmyPlanner

services:
  
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__Default=Host=database;Port=5432;Database=devdb;Username=postgres;Password=postgres

  frontend:
    build: ./frontend
    ports:
      - "8000:8000"
    command: ["npm", "run", "dev"]

  database:
    image: postgres:16
    restart: always
    environment: 
      POSTGRES_PASSWORD: postgres 
      POSTGRES_DB: devdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: